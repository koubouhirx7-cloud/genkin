<!DOCTYPE html>

<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1c74e9",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111821",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <title>現金実査入力</title>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
    <!-- Header -->
    <header
        class="sticky top-0 z-10 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex items-center justify-between">
        <button class="text-slate-600 dark:text-slate-400">
            <span class="material-symbols-outlined">arrow_back_ios</span>
        </button>
        <h1 class="text-lg font-bold">現金実査入力</h1>
        <div class="w-8"></div> <!-- Spacer -->
    </header>
    <main class="max-w-md mx-auto pb-24">
        <!-- Date Selector -->
        <section class="p-4 bg-white dark:bg-slate-900 mb-2">
            <label class="block text-sm font-medium text-slate-500 dark:text-slate-400 mb-2">実査日</label>
            <div class="flex items-center justify-between bg-slate-100 dark:bg-slate-800 rounded-lg p-3">
                <button class="text-primary"><span class="material-symbols-outlined">chevron_left</span></button>
                <span class="font-bold text-lg">2023年10月24日 (火)</span>
                <button class="text-primary"><span class="material-symbols-outlined">chevron_right</span></button>
            </div>
        </section>
        <!-- Summary Card -->
        <section class="p-4 grid grid-cols-2 gap-3 mb-2">
            <div class="bg-primary/10 dark:bg-primary/20 p-4 rounded-xl border border-primary/20">
                <p class="text-xs text-primary font-bold mb-1 uppercase tracking-wider">実査合計</p>
                <p class="text-2xl font-bold text-primary">¥ 148,256</p>
            </div>
            <div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800">
                <p class="text-xs text-slate-500 dark:text-slate-400 mb-1 font-bold">帳簿残高</p>
                <input
                    class="w-full bg-transparent border-none p-0 text-xl font-bold focus:ring-0 text-slate-900 dark:text-slate-100"
                    type="text" value="148,000" />
            </div>
            <div
                class="col-span-2 bg-slate-900 dark:bg-primary text-white p-3 rounded-lg flex justify-between items-center">
                <span class="text-sm font-medium">差引過不足</span>
                <span class="text-lg font-bold">+ ¥ 256</span>
            </div>
        </section>
        <!-- Denominations List -->
        <section class="bg-white dark:bg-slate-900">
            <div class="px-4 py-3 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center">
                <h2 class="font-bold text-slate-700 dark:text-slate-300 text-sm">金種別内訳</h2>
                <span class="text-xs text-slate-400 font-medium tracking-tight">数量を入力してください</span>
            </div>
            <!-- 10,000 Yen -->
            <div class="flex items-center gap-4 px-4 py-4 border-b border-slate-50 dark:border-slate-800/50">
                <div class="flex-1">
                    <p class="text-sm font-bold text-slate-900 dark:text-slate-100">10,000円札</p>
                    <p class="text-xs text-slate-400">金額: 120,000円</p>
                </div>
                <div class="flex items-center gap-3">
                    <button
                        class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-400">
                        <span class="material-symbols-outlined text-sm">remove</span>
                    </button>
                    <input class="w-12 text-center border-none bg-transparent font-bold text-lg focus:ring-0"
                        type="number" value="12" />
                    <button class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center">
                        <span class="material-symbols-outlined text-sm">add</span>
                    </button>
                </div>
            </div>
            <!-- 5,000 Yen -->
            <div class="flex items-center gap-4 px-4 py-4 border-b border-slate-50 dark:border-slate-800/50">
                <div class="flex-1">
                    <p class="text-sm font-bold text-slate-900 dark:text-slate-100">5,000円札</p>
                    <p class="text-xs text-slate-400">金額: 15,000円</p>
                </div>
                <div class="flex items-center gap-3">
                    <button
                        class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-400">
                        <span class="material-symbols-outlined text-sm">remove</span>
                    </button>
                    <input class="w-12 text-center border-none bg-transparent font-bold text-lg focus:ring-0"
                        type="number" value="3" />
                    <button class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center">
                        <span class="material-symbols-outlined text-sm">add</span>
                    </button>
                </div>
            </div>
            <!-- 1,000 Yen -->
            <div class="flex items-center gap-4 px-4 py-4 border-b border-slate-50 dark:border-slate-800/50">
                <div class="flex-1">
                    <p class="text-sm font-bold text-slate-900 dark:text-slate-100">1,000円札</p>
                    <p class="text-xs text-slate-400">金額: 10,000円</p>
                </div>
                <div class="flex items-center gap-3">
                    <button
                        class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-400">
                        <span class="material-symbols-outlined text-sm">remove</span>
                    </button>
                    <input class="w-12 text-center border-none bg-transparent font-bold text-lg focus:ring-0"
                        type="number" value="10" />
                    <button class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center">
                        <span class="material-symbols-outlined text-sm">add</span>
                    </button>
                </div>
            </div>
            <!-- 500 Yen -->
            <div class="flex items-center gap-4 px-4 py-4 border-b border-slate-50 dark:border-slate-800/50">
                <div class="flex-1">
                    <p class="text-sm font-bold text-slate-900 dark:text-slate-100">500円硬貨</p>
                    <p class="text-xs text-slate-400">金額: 2,500円</p>
                </div>
                <div class="flex items-center gap-3">
                    <button
                        class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-400">
                        <span class="material-symbols-outlined text-sm">remove</span>
                    </button>
                    <input class="w-12 text-center border-none bg-transparent font-bold text-lg focus:ring-0"
                        type="number" value="5" />
                    <button class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center">
                        <span class="material-symbols-outlined text-sm">add</span>
                    </button>
                </div>
            </div>
            <!-- 100 Yen -->
            <div class="flex items-center gap-4 px-4 py-4 border-b border-slate-50 dark:border-slate-800/50">
                <div class="flex-1">
                    <p class="text-sm font-bold text-slate-900 dark:text-slate-100">100円硬貨</p>
                    <p class="text-xs text-slate-400">金額: 700円</p>
                </div>
                <div class="flex items-center gap-3">
                    <button
                        class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-400">
                        <span class="material-symbols-outlined text-sm">remove</span>
                    </button>
                    <input class="w-12 text-center border-none bg-transparent font-bold text-lg focus:ring-0"
                        type="number" value="7" />
                    <button class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center">
                        <span class="material-symbols-outlined text-sm">add</span>
                    </button>
                </div>
            </div>
            <!-- 1 Yen -->
            <div class="flex items-center gap-4 px-4 py-4 border-b border-slate-50 dark:border-slate-800/50">
                <div class="flex-1">
                    <p class="text-sm font-bold text-slate-900 dark:text-slate-100">1円硬貨</p>
                    <p class="text-xs text-slate-400">金額: 56円</p>
                </div>
                <div class="flex items-center gap-3">
                    <button
                        class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-400">
                        <span class="material-symbols-outlined text-sm">remove</span>
                    </button>
                    <input class="w-12 text-center border-none bg-transparent font-bold text-lg focus:ring-0"
                        type="number" value="56" />
                    <button class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center">
                        <span class="material-symbols-outlined text-sm">add</span>
                    </button>
                </div>
            </div>
        </section>
        <!-- Save Button -->
        <div class="p-6">
            <button
                class="w-full bg-primary text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/30 hover:bg-primary/90 transition-all">
                保存して次へ
            </button>
        </div>
    </main>
    <!-- Bottom Navigation -->
    <nav
        class="fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex items-center justify-around px-2 pb-6 pt-2">
        <a class="flex flex-col items-center gap-1 text-primary" href="#">
            <span class="material-symbols-outlined fill-1">edit_document</span>
            <p class="text-[10px] font-bold">入力</p>
        </a>
        <a class="flex flex-col items-center gap-1 text-slate-400" href="#">
            <span class="material-symbols-outlined">history</span>
            <p class="text-[10px] font-bold">履歴</p>
        </a>
        <a class="flex flex-col items-center gap-1 text-slate-400" href="#">
            <span class="material-symbols-outlined">analytics</span>
            <p class="text-[10px] font-bold">分析</p>
        </a>
        <a class="flex flex-col items-center gap-1 text-slate-400" href="#">
            <span class="material-symbols-outlined">settings</span>
            <p class="text-[10px] font-bold">設定</p>
        </a>
    </nav>
</body>

</html>
