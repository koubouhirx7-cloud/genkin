<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('password').value;
            const btn = e.target.querySelector('button');
            const origText = btn.textContent;
            btn.textContent = '確認中...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: pass })
                });
                const data = await res.json();
                if(data.success) {
                    window.location.href = 'input_2.html';
                } else {
                    document.getElementById('error-msg').classList.remove('hidden');
                }
            } catch (err) {
                alert('サーバー通信に失敗しました (python3 server.py が起動しているか確認してください)');
            } finally {
                btn.textContent = origText;
                btn.disabled = false;
            }
        });
    </script>
    <title>ログイン - 現金実査</title>
</head>

<body class="bg-background-light dark:bg-background-dark flex items-center justify-center min-h-screen p-4">
    <div
        class="bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-xl max-w-sm w-full border border-slate-200 dark:border-slate-800">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                    </path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 dark:text-white">システムログイン</h1>
            <p class="text-slate-500 text-sm mt-2">PINコードを入力してください</p>
        </div>
        <form id="login-form" class="space-y-4">
            <div>
                <input type="password" id="password" inputmode="numeric"
                    class="w-full px-4 py-3 text-center tracking-[0.5em] text-xl rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all dark:text-white"
                    placeholder="****">
            </div>
            <button type="submit"
                class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3 rounded-xl transition-colors shadow-lg shadow-primary/30">
                ログイン
            </button>
            <p id="error-msg" class="text-red-500 text-sm text-center hidden">PINコードが間違っています</p>
        </form>
    </div>
        <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('password').value;
            const btn = e.target.querySelector('button');
            const origText = btn.textContent;
            btn.textContent = '確認中...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: pass })
                });
                const data = await res.json();
                if(data.success) {
                    window.location.href = 'input_2.html';
                } else {
                    document.getElementById('error-msg').classList.remove('hidden');
                }
            } catch (err) {
                alert('サーバー通信に失敗しました (python3 server.py が起動しているか確認してください)');
            } finally {
                btn.textContent = origText;
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
