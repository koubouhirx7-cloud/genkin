            </div>
            <!-- 1,000 Yen -->
            <div class="flex items-center gap-4 px-4 py-4 border-b border-slate-50 dark:border-slate-800/50">
                <div class="flex-1">
                    <p class="text-sm font-bold text-slate-900 dark:text-slate-100">1,000円札</p>
                    <p class="text-xs text-slate-400">金額: 10,000円</p>
                </div>

    <!-- Bottom Navigation -->
    <nav
        class="fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex items-center justify-around px-2 pb-6 pt-2">
        <a class="flex flex-col items-center gap-1 text-primary" href="input_2.html">
            <span class="material-symbols-outlined fill-1">edit_document</span>
            <p class="text-[10px] font-bold">入力</p>
        </a>
        <a class="flex flex-col items-center gap-1 text-slate-400" href="history.html">
            <span class="material-symbols-outlined">history</span>

        </a>
        <a class="flex flex-col items-center gap-1 text-slate-400" href="#">

        </a>
        <a class="flex flex-col items-center gap-1 text-slate-400" href="archive_summary.html">
            <span class="material-symbols-outlined">settings</span>
            <p class="text-[10px] font-bold">設定</p>
        </a>
    </nav>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Date switching
            const dateArrows = document.querySelectorAll('.p-4.bg-white button, section.p-4 button');
            const dateText = document.querySelector('.p-4.bg-white span.font-bold, section.p-4 span.font-bold');

            let currentDate = new Date();
            const tzOffset = currentDate.getTimezoneOffset() * 60000;
            currentDate = new Date(Date.now() - tzOffset); // Use local time for initial date

            const format = (date) => `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 (${['日', '月', '火', '水', '木', '金', '土'][date.getDay()]})`;
            if (dateText) dateText.textContent = format(currentDate);

            if (dateArrows.length >= 2 && dateText) {
                dateArrows[0].addEventListener('click', () => { currentDate.setDate(currentDate.getDate() - 1); dateText.textContent = format(currentDate); });
                dateArrows[1].addEventListener('click', () => { currentDate.setDate(currentDate.getDate() + 1); dateText.textContent = format(currentDate); });
            }

            // Calculator inputs
            const wrapper = document.querySelectorAll('.border-b.border-slate-50');
            const totalEl = document.querySelector('.text-2xl.font-bold.text-primary');
            const ledgerInput = document.querySelector('input[type="text"]');
            const diffEl = document.querySelector('.col-span-2.flex span.text-lg.font-bold') || document.querySelector('.col-span-2 span.text-lg.font-bold');

            let currentTotalVal = 0;

            wrapper.forEach(row => {
                const titleEl = row.querySelector('.text-sm.font-bold');
                if (!titleEl) return;

                const text = titleEl.textContent;
                const den = parseInt(text.replace(/[^0-9]/g, ''));
                if (isNaN(den)) return; // Skip if it's not a denomination row

                const input = row.querySelector('input[type="number"]');
                const minus = row.querySelector('button:first-of-type');
                const plus = row.querySelector('button:last-of-type');
                const amountDisplay = row.querySelector('.text-xs.text-slate-400');

                const updateRow = () => {
                    let qty = parseInt(input.value) || 0;
                    if (qty < 0) { qty = 0; input.value = 0; }
                    amountDisplay.textContent = `金額: ${(den * qty).toLocaleString()}円`;
                    recalc();
                };

                if (minus) minus.addEventListener('click', () => { input.value = Math.max(0, (parseInt(input.value) || 0) - 1); updateRow(); });
                if (plus) plus.addEventListener('click', () => { input.value = (parseInt(input.value) || 0) + 1; updateRow(); });
                input.addEventListener('input', updateRow);
            });

            function recalc() {
                let total = 0;
                wrapper.forEach(row => {
                    const titleEl = row.querySelector('.text-sm.font-bold');
                    if (!titleEl) return;
                    const text = titleEl.textContent;
                    const den = parseInt(text.replace(/[^0-9]/g, ''));
                    if (isNaN(den)) return;

                    const numInput = row.querySelector('input[type="number"]');
                    if (numInput) {
                        const qty = parseInt(numInput.value) || 0;
                        total += den * qty;
                    }
                });

                currentTotalVal = total;

                if (totalEl) totalEl.textContent = `¥ ${total.toLocaleString()}`;

                if (ledgerInput && diffEl) {
                    const ledger = parseInt(ledgerInput.value.replace(/,/g, '')) || 0;
                    const diff = total - ledger;

                    diffEl.textContent = `${diff >= 0 ? '+' : '-'} ¥ ${Math.abs(diff).toLocaleString()}`;
                    if (diff === 0) {
                        diffEl.parentElement.className = 'col-span-2 bg-emerald-500 text-white p-3 rounded-lg flex justify-between items-center';
                    } else if (diff < 0) {
                        diffEl.parentElement.className = 'col-span-2 bg-rose-500 text-white p-3 rounded-lg flex justify-between items-center';
                    } else {
                        diffEl.parentElement.className = 'col-span-2 bg-slate-900 dark:bg-primary text-white p-3 rounded-lg flex justify-between items-center';
                    }
                }
            }

            if (ledgerInput) {
                ledgerInput.addEventListener('input', (e) => {
                    // clean up formatting for ledger
                    let val = e.target.value.replace(/[^0-9]/g, '');
                    if (val) {
                        e.target.value = parseInt(val).toLocaleString();
                    }
                    recalc();
                });
            }

            recalc(); // initial

            // Save functionality
            const saveBtn = document.querySelector('.p-6 button');
            if (saveBtn) {
                saveBtn.addEventListener('click', () => {
                    const records = JSON.parse(localStorage.getItem('cash_audit_records') || '[]');

                    const formatYMD = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                    const dateStr = formatYMD(currentDate);

                    const ledgerVal = parseInt(ledgerInput.value.replace(/,/g, '')) || 0;
                    const diffVal = currentTotalVal - ledgerVal;

                    records.push({
                        id: Date.now().toString(),
                        date: dateStr,
                        total: currentTotalVal,
                        ledger: ledgerVal,
                        diff: diffVal,
                        note: ''
                    });
                    localStorage.setItem('cash_audit_records', JSON.stringify(records));
                    alert('実査記録を保存しました。履歴画面へ移動します。');
                    window.location.href = 'history.html';
                });
            }
        });
    </script>
</body>
